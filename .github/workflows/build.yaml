name: "haiku-ci"
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write   # to attach the package to a release

jobs:
  build-haiku:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    name: build-haiku-r1beta6-x86-64

    steps:
      - uses: actions/checkout@v7

      - name: Start Haiku VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta6'

      # the steps below run inside the VM, files are synced both ways
      - name: Install build dependencies
        shell: cpa.sh {0}
        run: pkgman install -y freetype_devel harfbuzz_devel openjpeg_devel jbig2dec_devel brotli_devel libjpeg_turbo_devel zlib_devel cmd:gcc gcc_syslibs_devel cmd:make cmd:pkg_config cmd:wget

      - name: Build and package
        shell: cpa.sh {0}
        run: ./build.sh && make -C tsundoku bindcatalogs && ./package.sh

      # the package is back in the workspace now
      - uses: actions/upload-artifact@v7
        with:
          name: tsundoku-haiku-r1beta6-x86-64
          path: "*.hpkg"
          if-no-files-found: error

      # pushing a tag like v0.1.0 publishes the package as a release
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: "*.hpkg"
          generate_release_notes: true
