version = 1
SPDX-PackageName = "Toji"
SPDX-PackageSupplier = "SEN Labs e.U."
SPDX-PackageDownloadLocation = "https://github.com/sen-laboratories/toji"

# The program and what belongs to it: AGPL-3.0-or-later (BePDF is GPL-2.0-or-later, which allows it; MuPDF is AGPL-3.0).
# The source files say so themselves (SPDX-License-Identifier in the header); these are the files that cannot.
[[annotations]]
path = [
	"README.md", "TRADEMARKS.md", "TODO.md", "PLAN-mupdf.md", "MUPDF-NOTES.md", "LICENSE",
	"build.sh", "package.sh", "package/**", ".github/**", ".gitignore", ".gitattributes", "REUSE.toml",
	"docs/**", "tests/**", "dist/license/**",
	"src/locales/**", "src/graphics/*.iom",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gregor B. Rosenauer & Claude, and the authors of BePDF (see README.md)"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The logo, the name's artwork and the icons that were made for Toji: CC BY 4.0. (This does not give rights to the name
# Toji or to SEN as trademarks.)
[[annotations]]
path = ["images/**", "src/graphics/toji.hvif"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gregor B. Rosenauer & Claude"
SPDX-License-Identifier = "CC-BY-4.0"

# The components that others may use (the source files carry their own MIT header)
[[annotations]]
path = ["lib/README.md", "lib/LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gregor B. Rosenauer & Claude"
SPDX-License-Identifier = "MIT"

# An icon from ArtPaint (https://github.com/HaikuArchives/ArtPaint), MIT license: the shapes button of the toolbar
[[annotations]]
path = ["src/graphics/artpaint/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The ArtPaint authors"
SPDX-License-Identifier = "MIT"

# The screenshots of the guide (of the user guide itself and of test documents of ours)
[[annotations]]
path = ["docs/guide/images/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gregor B. Rosenauer & Claude"
SPDX-License-Identifier = "CC-BY-4.0"

# These two screenshots show comics of others: Black Jack ni Yoroshiku by Shuho Sato (published on Manga on Web, free to
# use with attribution: LICENSES/LicenseRef-MangaOnWeb.txt) and Bobby Make-Believe (Chicago Sunday Tribune, 1915, public domain). The files of the comics are not
# in this repository.
[[annotations]]
path = ["docs/guide/images/manga-rtl.png"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Gregor B. Rosenauer & Claude", "Shuho Sato / Manga on Web (the manga shown)"]
SPDX-License-Identifier = "CC-BY-4.0 AND LicenseRef-MangaOnWeb"

[[annotations]]
path = ["docs/guide/images/comic-spread.png"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Gregor B. Rosenauer & Claude", "Chicago Sunday Tribune, 1915 (the comic shown, public domain)"]
SPDX-License-Identifier = "CC-BY-4.0"
